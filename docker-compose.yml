version: "3.9"

# despliegue backend (Nest) en Contabo → conecta a Supabase (Postgres gestionado).
# El frontend (Vercel) nunca accede a la base.
services:
  backend:
    build:
      context: ./backend
    container_name: crm_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      # Conexión Supabase (Pooler)
      DB_HOST: aws-0-us-west-2.pooler.supabase.com
      DB_PORT: 5432
      DB_USER: postgres.efhjsfjzvfllcoznnrqy
      DB_PASSWORD: Yw8m5pSHaOKep2jj
      DB_NAME: postgres
      DB_SSL: true
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_EXPIRES_IN: 1d
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    # Arranque: aplicar migraciones contra Supabase y luego correr la API
    command: >
      sh -c "echo Aplicando migraciones contra Supabase... &&
      node dist/config/bootstrap-migrate.js &&
      echo Migraciones OK - arrancando API... &&
      exec node dist/main.js"
    ports:
      - "3001:3001"

volumes:
  uploads:

