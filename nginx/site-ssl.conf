# Bloque HTTPS (se activa tras emitir el certificado con Certbot).
# Pasos: guardar como /etc/nginx/conf.d/api.saberoconsulting.com.conf y recargar.

server {
    # Forzar HTTPS
    listen 80;
    server_name api.saberoconsulting.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.saberoconsulting.com;

    ssl_certificate     /etc/letsencrypt/live/api.saberoconsulting.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.saberoconsulting.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
